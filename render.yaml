services:
  - type: web
    name: boss-hunter-3d
    runtime: node
    plan: starter        # free plan sleeps after idle; starter stays on
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
